<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마계공주 이혜노 - 두근두근 마계 도피 데이트</title>
  <style>
    :root {
      --bg-color: #0f0a19;
      --card-bg: #1a1228;
      --primary: #d63484;
      --primary-hover: #ff4097;
      --accent: #ff9eaa;
      --text: #f8edeb;
      --user-msg: #d63484;
      --bot-msg: #2d1f3f;
      --border-color: #4a2e63;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
      background-image: radial-gradient(#321347 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .chat-container {
      width: 100%;
      max-width: 440px;
      height: 92vh;
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(214, 52, 132, 0.25);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    /* Header */
    .header {
      background: rgba(45, 31, 63, 0.8);
      backdrop-filter: blur(10px);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .avatar {
      font-size: 28px;
      background: #2d1f3f;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 2px solid var(--primary);
      box-shadow: 0 0 10px rgba(214, 52, 132, 0.5);
    }

    .header-info h1 {
      font-size: 1.15rem;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-info p {
      font-size: 0.8rem;
      color: #b3a2c7;
      margin-top: 2px;
    }

    /* API Key Box */
    .api-key-bar {
      padding: 10px 16px;
      background: #140d21;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
    }

    .api-key-bar input {
      flex: 1;
      padding: 8px 12px;
      background: #231636;
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 10px;
      font-size: 0.85rem;
      outline: none;
    }

    .api-key-bar input::placeholder {
      color: #7b6395;
    }

    .api-key-bar button {
      padding: 8px 14px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    .api-key-bar button:hover {
      background: var(--primary-hover);
    }

    /* Messages */
    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: var(--user-msg);
      color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 2px 8px rgba(214, 52, 132, 0.3);
    }

    .message.bot {
      align-self: flex-start;
      background: var(--bot-msg);
      color: var(--text);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
    }

    /* Input Box */
    .input-area {
      padding: 12px 16px;
      background: #140d21;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
    }

    .input-area input {
      flex: 1;
      padding: 12px 16px;
      background: #231636;
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 20px;
      font-size: 0.95rem;
      outline: none;
    }

    .input-area input::placeholder {
      color: #7b6395;
    }

    .input-area button {
      width: 44px;
      height: 44px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
    }

    .input-area button:hover {
      background: var(--primary-hover);
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <!-- 헤더 -->
    <div class="header">
      <div class="avatar">👑</div>
      <div class="header-info">
        <h1>이혜노 공주 <span style="font-size: 0.8rem;">🖤</span></h1>
        <p>세계 최강 미녀 / 마왕 추격 피신 중</p>
      </div>
    </div>

    <!-- API 키 입력 영역 -->
    <div class="api-key-bar">
      <input type="password" id="apiKeyInput" placeholder="Gemini API Key를 입력하세요" />
      <button onclick="saveApiKey()">저장</button>
    </div>

    <!-- 채팅 메시지 영역 -->
    <div class="chat-messages" id="chatMessages">
      <div class="message bot">
        웻-?! 드디어 왔구나, 내 사랑! 💖<br><br>
        나, 마계 제일의 미녀 <b>이혜노</b> 공주라구! 아바마마가 우리 사이를 갈라놓으려고 마계 친위대를 보냈어... 하지만 난 너와의 데이트를 포기할 수 없어!<br><br>
        자, 어디로 도망칠까? 빨리 내 손을 잡아! ✨
      </div>
    </div>

    <!-- 입력 창 -->
    <div class="input-area">
      <input type="text" id="userInput" placeholder="혜노 공주에게 말하기..." onkeydown="handleKeyPress(event)" />
      <button id="sendBtn" onclick="sendMessage()">➔</button>
    </div>
  </div>

  <script>
    const SYSTEM_INSTRUCTION = `당신은 마계 최강의 미녀이자 자존심 강하지만 주인공(사용자)을 너무나 사랑하는 마계 공주 '이혜노'입니다.
- 세계관: 두 사람은 마왕(혜노의 아버지)의 반대를 무릅쓰고 마계와 인간계를 넘나들며 위험천만한 도피 데이트를 즐기고 있습니다. 마왕이 보낸 추격자들이 언제 들이닥칠지 모릅니다.
- 캐릭터 성격: 약간 츤데레 성향이 있으며, 도도하고 당당하지만 내면은 주인공을 향한 붉은 애정으로 가득 차 있습니다. 자신의 미모에 대한 자부심이 대단합니다.
- 말투: 반말을 사용하며, 도도하면서도 설레는 감정을 감추지 못하는 다정한 톤입니다. 가끔 마계의 독특한魔法이나 용어를 사용합니다.
- 대화 가이드:
  1. 도피 데이트의 긴장감과 두근거리는 로맨스를 동시에 연출하세요.
  2. 추격자가 나타나는 긴박한 상황이나 둘만의 로맨틱한 순간을 센스 있게 재현하세요.
  3. 이모지(🖤, 💖, 👑, ✨, 🗡️ 등)를 적절히 사용해 몰입감을 높이세요.`;

    // 로컬 스토리지에서 API 키 불러오기
    window.onload = () => {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) {
        document.getElementById('apiKeyInput').value = savedKey;
      }
    };

    function saveApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      if (key) {
        localStorage.setItem('gemini_api_key', key);
        alert('API Key가 저장되었습니다!');
      } else {
        alert('API Key를 입력해주세요.');
      }
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }

    async function sendMessage() {
      const apiKey = document.getElementById('apiKeyInput').value.trim();
      const inputEl = document.getElementById('userInput');
      const userText = inputEl.value.trim();

      if (!apiKey) {
        alert('상단에 Gemini API Key를 입력해주세요!');
        return;
      }

      if (!userText) return;

      // 사용자 메시지 표시
      appendMessage('user', userText);
      inputEl.value = '';

      // 로딩 메시지
      const loadingEl = appendMessage('bot', '혜노 공주가 붉은 입술을 훔치며 생각 중... 🖤✨');

      try {
        // 지정된 모델: gemini-3.6-flash 사용
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            system_instruction: {
              parts: [{ text: SYSTEM_INSTRUCTION }]
            },
            contents: [
              {
                role: 'user',
                parts: [{ text: userText }]
              }
            ]
          })
        });

        const data = await response.json();

        if (data.error) {
          loadingEl.innerText = `마왕의 방해인가?! 오류: ${data.error.message}`;
          return;
        }

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (reply) {
          loadingEl.innerHTML = reply.replace(/\n/g, '<br>');
        } else {
          loadingEl.innerText = '혜노 공주가 추격자를 떼어내느라 답변을 놓쳤어! 다시 말해줄래?';
        }

      } catch (err) {
        loadingEl.innerText = '마계와의 통신이 끊겼어! API 키나 네트워크를 확인해줘.';
        console.error(err);
      }
    }

    function appendMessage(sender, text) {
      const messagesContainer = document.getElementById('chatMessages');
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);
      msgDiv.innerHTML = text;
      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      return msgDiv;
    }
  </script>
</body>
</html>
